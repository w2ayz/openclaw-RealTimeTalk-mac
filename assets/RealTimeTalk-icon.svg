<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: dark navy gradient, matching the dashboard's own color identity -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111a2b"/>
      <stop offset="55%" stop-color="#0a0e18"/>
      <stop offset="100%" stop-color="#05060c"/>
    </linearGradient>
    <!-- Subtle top-left sheen for depth, macOS-style -->
    <radialGradient id="sheen" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#2a3b52" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#2a3b52" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2a3b52" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS squircle-ish rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <!-- Mark: the five-bar voice icon from the dashboard logo (same bars and
       proportions, sky blue #38bdf8), centred and scaled to fill the squircle. -->
  <g transform="translate(512,512) scale(11.5) translate(-26,-26)" fill="#38bdf8" filter="url(#glow)">
    <rect x="3"  y="20" width="6" height="12" rx="3"/>
    <rect x="13" y="12" width="6" height="28" rx="3"/>
    <rect x="23" y="4"  width="6" height="44" rx="3"/>
    <rect x="33" y="14" width="6" height="24" rx="3"/>
    <rect x="43" y="21" width="6" height="10" rx="3"/>
  </g>
</svg>
